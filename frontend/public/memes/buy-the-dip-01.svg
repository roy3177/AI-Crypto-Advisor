<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Buy the dip</title>
  <desc id="desc">A simple line chart dipping down then recovering</desc>
  <rect width="400" height="300" fill="#111827"/>
  <polyline points="40,120 120,150 200,230 280,110 360,80" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="200,230 280,110 360,80" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="230" r="8" fill="#facc15"/>
  <text x="200" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#facc15">buy here?</text>
  <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#f8fafc">BUY THE DIP</text>
</svg>
