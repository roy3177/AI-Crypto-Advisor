  <desc id="desc">A cartoon rocket flying toward the moon</desc>
  <rect width="400" height="300" fill="#0b1023"/>
  <circle cx="330" cy="60" r="34" fill="#e2e8f0"/>
  <circle cx="320" cy="48" r="6" fill="#cbd5e1"/>
  <circle cx="342" cy="70" r="4" fill="#cbd5e1"/>
